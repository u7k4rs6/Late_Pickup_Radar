# Late Pickup Radar configuration. No magic numbers in code: every threshold lives here
# or in pipeline/validation_rules.yml, and each one is justified in docs/assumptions.md.
# Values marked PLACEHOLDER are PRD starting points to be tuned against the real profile.

paths:
  raw_dir: data/raw
  warehouse_dir: data/warehouse
  outputs_dir: outputs
  logs_dir: logs

sources:
  # Verified in phase 1 (2026-09-24): see docs/source_map.md for status codes and headers.
  # PIPELINE_TRIPS_URL in the environment overrides trips_url_template (used by make demo-fail).
  trips_url_template: https://d37ci6vzurychx.cloudfront.net/trip-data/fhvhv_tripdata_{month}.parquet
  zones_url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
  weather_url: https://archive-api.open-meteo.com/v1/archive
  expected_counts_url: https://www.nyc.gov/assets/tlc/downloads/csv/data_reports_monthly.csv
  expected_counts_license_class: FHV - High Volume
  data_dictionary_url: https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_hvfhs.pdf

reference:
  # License -> company, from the HVFHV data dictionary dated 2025-03-18 (source_map S4).
  companies_source: data_dictionary_2025-03-18
  companies:
    HV0002: Juno
    HV0003: Uber
    HV0004: Via
    HV0005: Lyft

weather:
  # Central Park; its reanalysis grid cell lies over New Jersey (assumptions.md F5).
  latitude: 40.7829
  longitude: -73.9654
  request_timezone: GMT            # API local output is not DST-aware (assumptions.md F4)
  local_timezone: America/New_York
  hourly: [precipitation, temperature_2m, weather_code]

completeness:
  zone_count: 265
  low_hour_share: 0.05             # WARN if an hour has < 5% of the median hour's rows
  aggregate_band: 0.01             # WARN if |parquet rows - aggregate| / aggregate > 1%

kpi:
  late_minutes: 10                 # PLACEHOLDER: primary KPI threshold (PRD 1)
  sensitivity_minutes: [8, 15]

thresholds:
  rain_mm_per_hour: 0.5            # PLACEHOLDER: is_rainy (PRD 6.2)
  trust_floor: 0.95                # PLACEHOLDER: M5 hard-fail floor (PRD 7)

download:
  # nyc.gov answers 403 to non-browser User-Agents (python-requests, curl, and a
  # "compatible; bot" style UA all got 403 on 2026-09-25); this browser-style UA with the
  # project name appended gets 200. CloudFront accepts any UA. See source_map.md S5.
  user_agent: Mozilla/5.0 (X11; Linux x86_64) late-pickup-radar/0.1
  attempts: 3
  backoff_seconds: 2
  timeout_seconds: 60
  chunk_bytes: 1048576
